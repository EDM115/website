allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: false
  esbuild: true
  sharp: false
  unrs-resolver: true
  vue-demi: false

dedupePeers: true

lockfileIncludeTarballUrl: true

minimumReleaseAge: 120

minimumReleaseAgeExclude:
  - "@takumi-rs/*"
  - nuxt-schema-org

overrides:
  markdown-exit: ~1.1.0-beta.2
  nuxt-schema-org: ~6.3.0
  sharp: ~0.35.3

patchedDependencies:
  "@mdit/helper@1.1.0": patches/@mdit__helper@1.1.0.patch
  "@mdit/plugin-alert@2.0.0": patches/@mdit__plugin-alert@2.0.0.patch
  "@mdit/plugin-align@1.1.0": patches/@mdit__plugin-align@1.1.0.patch
  "@mdit/plugin-footnote@1.1.0": patches/@mdit__plugin-footnote@1.1.0.patch
  "@mdit/plugin-img-lazyload@1.1.0": patches/@mdit__plugin-img-lazyload@1.1.0.patch
  "@mdit/plugin-img-size@1.1.0": patches/@mdit__plugin-img-size@1.1.0.patch
  "@mdit/plugin-ins@2.1.0": patches/@mdit__plugin-ins@2.1.0.patch
  "@mdit/plugin-katex@1.1.0": patches/@mdit__plugin-katex@1.1.0.patch
  "@mdit/plugin-mark@2.1.0": patches/@mdit__plugin-mark@2.1.0.patch
  "@mdit/plugin-spoiler@2.1.0": patches/@mdit__plugin-spoiler@2.1.0.patch
  "@mdit/plugin-tab@2.0.0": patches/@mdit__plugin-tab@2.0.0.patch
  "@mdit/plugin-tasklist@1.1.0": patches/@mdit__plugin-tasklist@1.1.0.patch
  "@mdit/plugin-tex@1.1.0": patches/@mdit__plugin-tex@1.1.0.patch
  "@types/markdown-it-emoji@3.0.1": patches/@types__markdown-it-emoji@3.0.1.patch
  "@types/markdown-it-link-attributes@3.0.5": patches/@types__markdown-it-link-attributes@3.0.5.patch
  markdown-exit@1.1.0-beta.2: patches/markdown-exit@1.1.0-beta.2.patch
  markdown-it-anchor@9.2.1: patches/markdown-it-anchor@9.2.1.patch
  markdown-it-attrs@5.0.1: patches/markdown-it-attrs@5.0.1.patch
  markdown-it-highlightjs@4.3.0: patches/markdown-it-highlightjs@4.3.0.patch
  markdown-it-toc-done-right@4.2.0: patches/markdown-it-toc-done-right@4.2.0.patch

publicHoistPattern:
  - "@unhead/schema-org"

resolutionMode: highest

savePrefix: "~"
